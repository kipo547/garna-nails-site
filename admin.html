<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмінка | garna_nails</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fa;
      color: #2d2d2f;
      padding: 24px;
    }

    .admin {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #f0d6df;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
      letter-spacing: -0.05em;
    }

    h2 {
      margin-top: 34px;
      border-top: 1px solid #f0d6df;
      padding-top: 24px;
    }

    label {
      font-weight: 700;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 16px;
      font-size: 15px;
      margin: 7px 0 14px;
      font-family: inherit;
      background: #fffafc;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      background: #2d2d2f;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin: 6px 6px 6px 0;
    }

    .small-btn {
      background: #d79aaa;
    }

    .danger {
      background: #b84a62;
    }

    .card {
      border: 1px solid #f0d6df;
      background: #fffafc;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .hint {
      color: #777;
      line-height: 1.6;
    }

    .status {
      font-weight: 700;
      color: #d79aaa;
      margin-top: 14px;
    }

    .preview {
      max-width: 180px;
      border-radius: 16px;
      margin: 10px 0 18px;
      display: block;
      border: 1px solid #f0d6df;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
      position: sticky;
      bottom: 16px;
      background: rgba(255,255,255,0.92);
      padding: 14px;
      border: 1px solid #f0d6df;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    #editor {
      display: none;
    }
  </style>
</head>

<body>
  <div class="admin">
    <h1>Адмінка garna_nails</h1>
    <p class="hint">Тут можна змінювати сайт без коду. Після збереження сайт оновиться через 30–60 секунд.</p>

    <div id="login">
      <input type="password" id="password" placeholder="Пароль від адмінки">
      <button id="loginBtn">Увійти</button>
      <p class="status" id="loginStatus"></p>
    </div>

    <div id="editor">
      <h2>Основна інформація</h2>

      <label>Ім’я</label>
      <input id="name">

      <label>Нік</label>
      <input id="nickname">

      <label>Опис</label>
      <textarea id="description"></textarea>

      <label>Instagram</label>
      <input id="instagram">

      <label>TikTok</label>
      <input id="tiktok">

      <label>Telegram</label>
      <input id="telegram">

      <h2>Послуги</h2>
      <div id="services"></div>
      <button class="small-btn" id="addServiceBtn">+ Додати послугу</button>

      <h2>Портфоліо</h2>
      <p class="hint">
        Можна завантажити фото з комп’ютера. Після завантаження натисни <b>Зберегти зміни</b>.
      </p>
      <div id="portfolio"></div>
      <button class="small-btn" id="addPortfolioBtn">+ Додати роботу</button>

      <h2>Питання / FAQ</h2>
      <div id="faq"></div>
      <button class="small-btn" id="addFaqBtn">+ Додати питання</button>

      <div class="topbar">
        <button id="saveBtn">Зберегти зміни</button>
        <button class="small-btn" onclick="location.href='/'">Відкрити сайт</button>
        <p class="status" id="status"></p>
      </div>
    </div>
  </div>

  <script>
    let data = {};
    let adminPassword = "";

    const loginBox = document.getElementById("login");
    const editorBox = document.getElementById("editor");
    const statusBox = document.getElementById("status");
    const loginStatus = document.getElementById("loginStatus");

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("addServiceBtn").addEventListener("click", addService);
    document.getElementById("addPortfolioBtn").addEventListener("click", addPortfolio);
    document.getElementById("addFaqBtn").addEventListener("click", addFaq);
    document.getElementById("saveBtn").addEventListener("click", saveContent);

    async function login() {
      adminPassword = document.getElementById("password").value.trim();
      loginStatus.textContent = "Перевіряємо пароль...";

      try {
        const res = await fetch("/admin-load", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": adminPassword
          }
        });

        if (!res.ok) {
          const errorText = await res.text();
          loginStatus.textContent = "Помилка входу: " + errorText;
          return;
        }

        data = await res.json();

        loginBox.style.display = "none";
        editorBox.style.display = "block";
        loginStatus.textContent = "";

        render();
      } catch (error) {
        loginStatus.textContent = "Помилка завантаження адмінки.";
      }
    }

    function render() {
      document.getElementById("name").value = data.name || "";
      document.getElementById("nickname").value = data.nickname || "";
      document.getElementById("description").value = data.description || "";
      document.getElementById("instagram").value = data.instagram || "";
      document.getElementById("tiktok").value = data.tiktok || "";
      document.getElementById("telegram").value = data.telegram || "";

      renderServices();
      renderPortfolio();
      renderFaq();
    }

    function collectBase() {
      data.name = document.getElementById("name").value;
      data.nickname = document.getElementById("nickname").value;
      data.description = document.getElementById("description").value;
      data.instagram = document.getElementById("instagram").value;
      data.tiktok = document.getElementById("tiktok").value;
      data.telegram = document.getElementById("telegram").value;
    }

    function renderServices() {
      const box = document.getElementById("services");
      box.innerHTML = "";

      data.services = data.services || [];

      data.services.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <label>Назва послуги</label>
          <input data-service-title="${index}" value="${escapeHtml(item.title || "")}">

          <label>Опис</label>
          <textarea data-service-text="${index}">${escapeHtml(item.text || "")}</textarea>

          <label>Куди веде при кліку</label>
          <select data-service-category="${index}">
            <option value="product">Предметні фото</option>
            <option value="hand">Фото на руці</option>
            <option value="macro">Макро текстури</option>
            <option value="video">Відео контент</option>
            <option value="all">Усі роботи</option>
            <option value="contact">Контакти / заявка</option>
          </select>

          <button class="danger" data-remove-service="${index}">Видалити</button>
        `;

        box.appendChild(card);

        card.querySelector(`[data-service-category="${index}"]`).value = item.category || "product";
      });

      box.querySelectorAll("[data-service-title]").forEach(input => {
        input.addEventListener("input", () => {
          data.services[input.dataset.serviceTitle].title = input.value;
        });
      });

      box.querySelectorAll("[data-service-text]").forEach(textarea => {
        textarea.addEventListener("input", () => {
          data.services[textarea.dataset.serviceText].text = textarea.value;
        });
      });

      box.querySelectorAll("[data-service-category]").forEach(select => {
        select.addEventListener("change", () => {
          data.services[select.dataset.serviceCategory].category = select.value;
        });
      });

      box.querySelectorAll("[data-remove-service]").forEach(button => {
        button.addEventListener("click", () => {
          data.services.splice(button.dataset.removeService, 1);
          renderServices();
        });
      });
    }

    function addService() {
      data.services = data.services || [];
      data.services.push({
        title: "Нова послуга",
        text: "Опис послуги",
        category: "product"
      });
      renderServices();
    }

    function renderPortfolio() {
      const box = document.getElementById("portfolio");
      box.innerHTML = "";

      data.portfolio = data.portfolio || [];

      data.portfolio.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <label>Назва роботи</label>
          <input data-work-title="${index}" value="${escapeHtml(item.title || "")}">

          <label>Категорія</label>
          <select data-work-category="${index}">
            <option value="product">Предметні фото</option>
            <option value="hand">Фото на руці</option>
            <option value="macro">Макро текстури</option>
            <option value="video">Відео контент</option>
          </select>

          <label>Фото</label>
          <input data-work-image="${index}" value="${escapeHtml(item.image || "")}">

          <input type="file" accept="image/*,video/mp4,video/webm" data-upload-image="${index}">

          ${item.image ? `<img class="preview" src="/${item.image}" alt="">` : ""}

          <label>Розмір блоку</label>
          <select data-work-size="${index}">
            <option value="">Звичайний</option>
            <option value="tall">Високий</option>
            <option value="wide">Широкий</option>
          </select>

          <button class="danger" data-remove-work="${index}">Видалити</button>
        `;

        box.appendChild(card);

        card.querySelector(`[data-work-category="${index}"]`).value = item.category || "product";
        card.querySelector(`[data-work-size="${index}"]`).value = item.size || "";
      });

      box.querySelectorAll("[data-work-title]").forEach(input => {
        input.addEventListener("input", () => {
          data.portfolio[input.dataset.workTitle].title = input.value;
        });
      });

      box.querySelectorAll("[data-work-category]").forEach(select => {
        select.addEventListener("change", () => {
          data.portfolio[select.dataset.workCategory].category = select.value;
        });
      });

      box.querySelectorAll("[data-work-image]").forEach(input => {
        input.addEventListener("input", () => {
          data.portfolio[input.dataset.workImage].image = input.value;
        });
      });

      box.querySelectorAll("[data-work-size]").forEach(select => {
        select.addEventListener("change", () => {
          data.portfolio[select.dataset.workSize].size = select.value;
        });
      });

      box.querySelectorAll("[data-upload-image]").forEach(input => {
        input.addEventListener("change", event => {
          uploadImage(event, Number(input.dataset.uploadImage));
        });
      });

      box.querySelectorAll("[data-remove-work]").forEach(button => {
        button.addEventListener("click", () => {
          data.portfolio.splice(button.dataset.removeWork, 1);
          renderPortfolio();
        });
      });
    }

    function addPortfolio() {
      data.portfolio = data.portfolio || [];
      data.portfolio.push({
        title: "Нова робота",
        category: "product",
        image: "",
        size: ""
      });
      renderPortfolio();
    }

    function renderFaq() {
      const box = document.getElementById("faq");
      box.innerHTML = "";

      data.faq = data.faq || [];

      data.faq.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <label>Питання</label>
          <input data-faq-question="${index}" value="${escapeHtml(item.question || "")}">

          <label>Відповідь</label>
          <textarea data-faq-answer="${index}">${escapeHtml(item.answer || "")}</textarea>

          <button class="danger" data-remove-faq="${index}">Видалити</button>
        `;

        box.appendChild(card);
      });

      box.querySelectorAll("[data-faq-question]").forEach(input => {
        input.addEventListener("input", () => {
          data.faq[input.dataset.faqQuestion].question = input.value;
        });
      });

      box.querySelectorAll("[data-faq-answer]").forEach(textarea => {
        textarea.addEventListener("input", () => {
          data.faq[textarea.dataset.faqAnswer].answer = textarea.value;
        });
      });

      box.querySelectorAll("[data-remove-faq]").forEach(button => {
        button.addEventListener("click", () => {
          data.faq.splice(button.dataset.removeFaq, 1);
          renderFaq();
        });
      });
    }

    function addFaq() {
      data.faq = data.faq || [];
      data.faq.push({
        question: "Нове питання",
        answer: "Відповідь"
      });
      renderFaq();
    }

    async function uploadImage(event, index) {
      const file = event.target.files[0];
      if (!file) return;

      statusBox.textContent = "Завантажуємо фото...";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("/admin-upload", {
          method: "POST",
          headers: {
            "x-admin-password": adminPassword
          },
          body: formData
        });

        if (!res.ok) {
          const errorText = await res.text();
          statusBox.textContent = "Помилка завантаження: " + errorText;
          return;
        }

        const result = await res.json();

        data.portfolio[index].image = result.path;

        statusBox.textContent = "Фото завантажено. Натисни «Зберегти зміни».";
        renderPortfolio();
      } catch (error) {
        statusBox.textContent = "Помилка завантаження фото.";
      }
    }

    async function saveContent() {
      collectBase();

      statusBox.textContent = "Зберігаємо...";

      try {
        const res = await fetch("/admin-save", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": adminPassword
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          statusBox.textContent = "Збережено. Сайт оновиться через 30–60 секунд.";
        } else {
          const errorText = await res.text();
          statusBox.textContent = "Помилка збереження: " + errorText;
        }
      } catch (error) {
        statusBox.textContent = "Помилка збереження.";
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
  </script>
</body>
</html>
