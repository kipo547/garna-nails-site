backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: "uk"

collections:
  - name: "content"
    label: "Контент сайту"
    files:
      - file: "data/site.yml"
        label: "Основна інформація"
        name: "site"
        fields:
          - { label: "Ім’я", name: "name", widget: "string" }
          - { label: "Нік", name: "nickname", widget: "string" }
          - { label: "Опис", name: "description", widget: "text" }
          - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "TikTok", name: "tiktok", widget: "string" }
          - { label: "Telegram", name: "telegram", widget: "string" }

      - file: "data/services.yml"
        label: "Послуги"
        name: "services"
        fields:
          - label: "Список послуг"
            name: "items"
            widget: "list"
            fields:
              - { label: "Назва", name: "title", widget: "string" }
              - { label: "Опис", name: "text", widget: "text" }

      - file: "data/faq.yml"
        label: "Питання"
        name: "faq"
        fields:
          - label: "Питання"
            name: "items"
            widget: "list"
            fields:
              - { label: "Питання", name: "question", widget: "string" }
              - { label: "Відповідь", name: "answer", widget: "text" }
        - name: "portfolio"
    label: "Портфоліо"
    files:
      - file: "data/portfolio.json"
        label: "Роботи"
        name: "portfolio"
        fields:
          - label: "Список робіт"
            name: "items"
            widget: "list"
            fields:
              - { label: "Назва", name: "title", widget: "string" }
              - label: "Категорія"
                name: "category"
                widget: "select"
                options:
                  - { label: "Предметні фото", value: "product" }
                  - { label: "Фото на руці", value: "hand" }
                  - { label: "Макро текстури", value: "macro" }
                  - { label: "Відео контент", value: "video" }
              - { label: "Фото", name: "image", widget: "image" }
              - label: "Розмір блоку"
                name: "size"
                widget: "select"
                options:
                  - { label: "Звичайний", value: "" }
                  - { label: "Високий", value: "tall" }
                  - { label: "Широкий", value: "wide" }
                required: false

  - name: "settings"
    label: "Налаштування стилю"
    files:
      - file: "data/settings.json"
        label: "Стиль сайту"
        name: "settings"
        fields:
          - { label: "Основний рожевий колір", name: "pink", widget: "string", default: "#f6d6df" }
          - { label: "Світлий рожевий", name: "pink_light", widget: "string", default: "#fdeef3" }
          - { label: "Темно-сірий", name: "gray", widget: "string", default: "#2d2d2f" }  
