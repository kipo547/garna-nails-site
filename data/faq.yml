items:
  - question: "Як відбувається співпраця?"
    answer: "Спочатку обговорюємо задачу, продукт, формат контенту, терміни, референси та бажаний результат. Після цього формується індивідуальна пропозиція."
  - question: "Як формується ціна?"
    answer: "Ціна залежить від кількості матеріалів, складності зйомки, реквізиту, монтажу, терміновості та формату контенту."
  - question: "Чи можна замовити тільки відео?"
    answer: "Так, можна замовити окремо фото, відео або комплексну зйомку під бренд."
  - question: "Куди приходять заявки?"
    answer: "Усі заявки з сайту автоматично надходять у Telegram."
