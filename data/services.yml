items:
  - title: "Предметні фото"
    text: "Естетична зйомка продуктів для брендів, сайтів, каталогів та соцмереж."
  - title: "Фото на сайт"
    text: "Візуал для сайтів, Amazon, маркетплейсів, презентацій та сторінок бренду."
  - title: "Відео контент"
    text: "Короткі ролики, TikTok/Reels формат, презентації продукту та експертні відео."
  - title: "Співпраця"
    text: "Колаборації, рекламний контент, комплексна зйомка та робота з beauty-брендами."
